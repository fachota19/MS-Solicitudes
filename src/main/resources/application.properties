# ========== APLICACIÓN ==========
spring.application.name=ms-solicitudes
server.port=8085

# ========== ENCODING UTF-8 ==========
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ========== BASE DE DATOS ==========
spring.datasource.url=jdbc:postgresql://localhost:5436/solicitudesdb?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA/HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== INICIALIZACIÓN DE DATOS ==========
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# ========== SEGURIDAD (KEYCLOAK JWT) ==========
# Estas propiedades se habilitarán cuando integres Keycloak
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/tpi-backend
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/tpi-backend/protocol/openid-connect/certs

# ========== SWAGGER/OPENAPI ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========== LOGGING ==========
logging.level.root=INFO
logging.level.ar.edu.utn.frc.backend.grupo114=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE