##############################################
# 🔧 CONFIGURACIÓN DE BASE DE DATOS (POSTGRES)
##############################################

spring.datasource.url=jdbc:postgresql://solicitudes-db:5432/solicitudesdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

##############################################
# 🧱 JPA / HIBERNATE
##############################################

# IMPORTANTE: Usar 'create' y defer-datasource-initialization para que data.sql funcione
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desactivar open-in-view para evitar problemas de lazy loading
spring.jpa.open-in-view=false

##############################################
# 🌍 SERVIDOR
##############################################

server.port=8085

##############################################
# 🚫 SEGURIDAD (DESACTIVADA PARA DESARROLLO)
##############################################

spring.security.enabled=false

##############################################
# 🌎 OPENAPI CONFIG
##############################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

##############################################
# 🤝 FEIGN CLIENTS
##############################################

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=20000
feign.client.config.default.loggerLevel=full

ms.usuarios.url=http://ms-usuarios:8080/api
ms.tarifas.url=http://ms-tarifas:8080/api
ms.camiones.url=http://ms-camiones:8080/api

##############################################
# 🪵 LOGGING
##############################################

logging.file.name=logs/solicitudes.log
logging.level.root=INFO
logging.level.ar.edu.utn.frc.backend.grupo114=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

##############################################
# 📥 INICIALIZACIÓN DE DATA.SQL
##############################################

# CRÍTICO: Ejecutar data.sql DESPUÉS de crear las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=postgres
spring.sql.init.encoding=UTF-8