server.port=8080

##############################################
# 🔧 BASE DE DATOS
##############################################

spring.datasource.url=jdbc:postgresql://solicitudes-db:5432/solicitudesdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

##############################################
# 🧱 JPA
##############################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

##############################################
# 🔒 KEYCLOAK SECURITY
##############################################

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/tpi-backend

##############################################
# 🌎 SWAGGER
##############################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

##############################################
# 🔗 FEIGN CLIENTS (si usás)
##############################################

ms.usuarios.url=http://ms-usuarios:8080
ms.tarifas.url=http://ms-tarifas:8080
ms.camiones.url=http://ms-camiones:8080

##############################################
# 🪵 LOGGING
##############################################

logging.level.root=INFO
logging.level.ar.edu.utn.frc.backend.grupo114=DEBUG
