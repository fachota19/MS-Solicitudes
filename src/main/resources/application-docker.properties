# ========== APLICACIÓN ==========
spring.application.name=ms-solicitudes
server.port=8084

# ========== BASE DE DATOS (DOCKER) ==========
spring.datasource.url=jdbc:postgresql://solicitudes-db:5432/solicitudesdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA/HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== INICIALIZACIÓN DE DATOS ==========
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true

# ========== SEGURIDAD (KEYCLOAK JWT) ==========
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/tpi-backend
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/certs

# ========== SWAGGER/OPENAPI ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ========== LOGGING ==========
logging.level.root=INFO
logging.level.ar.edu.utn.frc.backend.grupo114=DEBUG

